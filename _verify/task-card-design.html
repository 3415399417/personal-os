<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>任务卡片</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #F5F5F7;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 整体卡片：左右两栏 */
  .task-card {
    width: 560px;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    display: flex;
  }

  /* 左栏：标签 + 标题区 + 元数据行 */
  .left-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* 右栏：子任务块 + 底部操作区 */
  .right-col {
    flex: none;
    width: 220px;
    display: flex;
    flex-direction: column;
  }

  /* 第一层：顶部标签栏 */
  .top-badge {
    display: inline-block;
    background: #2B5FD7;
    color: #FFFFFF;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 20px;
  }

  /* 第二层：标题区（flex 撑开，把元数据行顶到底部） */
  .title-block {
    margin-top: 14px;
    flex: 1;
  }
  .main-title {
    font-size: 22px;
    font-weight: 700;
    color: #1A1A1A;
  }
  .sub-title {
    font-size: 15px;
    font-weight: 400;
    color: #8C8C8C;
    margin-top: 4px;
  }

  /* 第三层：元数据行（带进度条） */
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .meta-text {
    font-size: 13px;
    color: #8C8C8C;
  }
  .progress-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .progress-track {
    width: 80px;
    height: 6px;
    background: #F0F0F0;
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    width: 56%;
    height: 100%;
    background: #2B5FD7;
    border-radius: 10px;
  }
  .progress-num {
    font-size: 13px;
    font-weight: 600;
    color: #2B5FD7;
  }

  /* 左右栏之间的垂直分割线 */
  .divider {
    border: none;
    border-left: 1px solid #F0F0F0;
    margin: 0 12px;
  }

  /* 第五层：子任务块 */
  .subtask-block {
    background: #F7F8FA;
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .subtask-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .subtask-label {
    font-size: 12px;
    font-weight: 600;
    color: #8C8C8C;
  }
  .subtask-name {
    font-size: 15px;
    font-weight: 500;
    color: #1A1A1A;
  }
  .subtask-arrow {
    font-size: 16px;
    color: #2B5FD7;
  }

  /* 底部操作区（右栏内，贴底） */
  .action-row {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: auto;
    padding-top: 16px;
    flex-wrap: wrap;
  }
  .btn-continue {
    background: transparent;
    border: 1px solid #D9D9D9;
    border-radius: 20px;
    font-size: 14px;
    color: #595959;
    padding: 6px 16px;
    cursor: pointer;
  }
  .btn-submit {
    background: #2B5FD7;
    color: #FFFFFF;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    padding: 6px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="task-card">
    <!-- 左栏：标签 + 标题 + 元数据 -->
    <div class="left-col">
      <!-- 顶部标签 -->
      <span class="top-badge">今日最重要</span>

      <!-- 标题区 -->
      <div class="title-block">
        <div class="main-title">BetterLife AI</div>
        <div class="sub-title">个人管理系统</div>
      </div>

      <!-- 元数据行 -->
      <div class="meta-row">
        <span class="meta-text">来源：项目 · 阶段：进行中</span>
        <div class="progress-group">
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
          <span class="progress-num">56%</span>
        </div>
      </div>
    </div>

    <!-- 垂直分割线 -->
    <hr class="divider" />

    <!-- 右栏：子任务块 + 按钮 -->
    <div class="right-col">
      <!-- 子任务块 -->
      <div class="subtask-block">
        <div class="subtask-left">
          <span class="subtask-label">主任务</span>
          <span class="subtask-name">基础 CRUD</span>
        </div>
        <span class="subtask-arrow">→</span>
      </div>

      <!-- 底部操作区 -->
      <div class="action-row">
        <button class="btn-continue">继续工作 ▶</button>
        <button class="btn-submit">提交成果</button>
      </div>
    </div>
  </div>
</body>
</html>
